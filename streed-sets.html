<style>

/* =========================
   BOTÓN DEL MENÚ
========================= */

.streed-menu-button {
    position: fixed;
    top: 22px;
    left: 22px;

    width: 38px;
    height: 32px;

    border: none;
    outline: none;
    background: transparent;

    padding: 4px;

    cursor: pointer;
    z-index: 10002;

    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;

    appearance: none;
    -webkit-appearance: none;

    transition: none;
}

/* Líneas */

.streed-menu-button span {
    display: block;

    width: 28px;
    height: 3px;

    background: #000;

    transform-origin: center;

    transition:
        transform .4s cubic-bezier(.77,0,.18,1),
        opacity .25s ease,
        background .25s ease;
}

/* No hay efecto hover */

.streed-menu-button:hover {
    background: transparent;
    transform: none;
}

.streed-menu-button:hover span {
    background: #000;
}


/* =========================
   X CUANDO EL MENÚ ESTÁ ABIERTO
========================= */

.streed-menu-button.active {
    background: transparent;
    border: none;
    transform: none;
}

.streed-menu-button.active span {
    background: #ff0000;
}

.streed-menu-button.active span:nth-child(1) {
    transform: translateY(8px) rotate(45deg);
}

.streed-menu-button.active span:nth-child(2) {
    opacity: 0;
    transform: scaleX(0);
}

.streed-menu-button.active span:nth-child(3) {
    transform: translateY(-8px) rotate(-45deg);
}


/* =========================
   FONDO OSCURO
========================= */

.streed-overlay {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.45);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);

    opacity: 0;
    visibility: hidden;

    z-index: 9998;

    transition:
        opacity .5s ease,
        visibility .5s ease;
}

.streed-overlay.active {
    opacity: 1;
    visibility: visible;
}


/* =========================
   PANEL DEL MENÚ
========================= */

.streed-menu {
    position: fixed;

    top: 0;
    left: 0;

    width: 350px;
    max-width: 82vw;
    height: 100vh;

    background: #fff;
    color: #000;

    z-index: 10000;

    padding: 105px 38px 30px;

    display: flex;
    flex-direction: column;

    transform: translateX(-105%);

    transition:
        transform .65s cubic-bezier(.77,0,.18,1);

    overflow: hidden;
}


/* Línea roja lateral */

.streed-menu::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 7px;
    height: 100%;

    background: #ff0000;

    transform: scaleY(0);
    transform-origin: top;

    transition:
        transform .8s cubic-bezier(.77,0,.18,1);
}


/* Menú abierto */

.streed-menu.active {
    transform: translateX(0);
}

.streed-menu.active::before {
    transform: scaleY(1);
}


/* =========================
   ENLACES
========================= */

.streed-links {
    display: flex;
    flex-direction: column;
    width: 100%;
}

.streed-links a {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: space-between;

    text-decoration: none;

    color: #000;

    padding: 17px 0;

    border-bottom: 2px solid #111;

    overflow: hidden;

    opacity: 0;
    transform: translateX(-50px);

    transition:
        opacity .5s ease,
        transform .5s ease;
}


/* Animación de entrada */

.streed-menu.active .streed-links a:nth-child(1) {
    opacity: 1;
    transform: translateX(0);
    transition-delay: .20s;
}

.streed-menu.active .streed-links a:nth-child(2) {
    opacity: 1;
    transform: translateX(0);
    transition-delay: .27s;
}

.streed-menu.active .streed-links a:nth-child(3) {
    opacity: 1;
    transform: translateX(0);
    transition-delay: .34s;
}

.streed-menu.active .streed-links a:nth-child(4) {
    opacity: 1;
    transform: translateX(0);
    transition-delay: .41s;
}

.streed-menu.active .streed-links a:nth-child(5) {
    opacity: 1;
    transform: translateX(0);
    transition-delay: .48s;
}

.streed-menu.active .streed-links a:nth-child(6) {
    opacity: 1;
    transform: translateX(0);
    transition-delay: .55s;
}


/* Línea roja inferior */

.streed-links a::before {
    content: "";

    position: absolute;

    bottom: 0;
    left: 0;

    width: 0;
    height: 4px;

    background: #ff0000;

    transition:
        width .35s cubic-bezier(.77,0,.18,1);
}

.streed-links a:hover::before {
    width: 100%;
}


/* Texto */

.menu-text {
    font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        sans-serif;

    font-size: 29px;
    letter-spacing: 1px;

    transition:
        transform .35s cubic-bezier(.77,0,.18,1),
        color .25s ease;
}

.streed-links a:hover .menu-text {
    color: #ff0000;
    transform: translateX(10px);
}


/* Flecha */

.menu-arrow {
    font-family: Arial, sans-serif;

    font-size: 22px;

    color: #000;

    transform: translateX(-10px);
    opacity: 0;

    transition:
        transform .3s ease,
        opacity .3s ease,
        color .3s ease;
}

.streed-links a:hover .menu-arrow {
    transform: translateX(0);
    opacity: 1;
    color: #ff0000;
}


/* =========================
   TABLET / MÓVIL
========================= */

@media (max-width: 600px) {

    .streed-menu-button {
        top: 15px;
        left: 15px;

        width: 36px;
        height: 30px;

        padding: 3px;
        gap: 5px;
    }

    .streed-menu-button span {
        width: 27px;
        height: 3px;
    }

    .streed-menu-button.active span:nth-child(1) {
        transform: translateY(8px) rotate(45deg);
    }

    .streed-menu-button.active span:nth-child(3) {
        transform: translateY(-8px) rotate(-45deg);
    }

    .streed-menu {
        width: 310px;
        max-width: 85vw;

        padding: 95px 30px 25px;
    }

    .menu-text {
        font-size: 26px;
    }

    .streed-links a {
        padding: 15px 0;
    }
}


/* =========================
   TELÉFONOS PEQUEÑOS
========================= */

@media (max-width: 400px) {

    .streed-menu-button {
        width: 34px;
        height: 28px;
    }

    .streed-menu-button span {
        width: 25px;
        height: 3px;
    }

    .streed-menu {
        width: 285px;

        padding-left: 27px;
        padding-right: 27px;
    }

    .menu-text {
        font-size: 24px;
    }
}

</style>


<!-- =========================
     BOTÓN
========================= -->

<button
    id="menuToggle"
    class="streed-menu-button"
    aria-label="Abrir menú"
    type="button"
>
    <span></span>
    <span></span>
    <span></span>
</button>


<!-- =========================
     FONDO
========================= -->

<div
    id="menuOverlay"
    class="streed-overlay"
></div>


<!-- =========================
     MENÚ
========================= -->

<nav
    id="menuPanel"
    class="streed-menu"
>

    <div class="streed-links">

        <a href="index.html">
            <span class="menu-text">INICIO</span>
            <span class="menu-arrow">↗</span>
        </a>

        <a href="camisas.html">
            <span class="menu-text">CAMISAS</span>
            <span class="menu-arrow">↗</span>
        </a>

        <a href="gorras.html">
            <span class="menu-text">GORRAS</span>
            <span class="menu-arrow">↗</span>
        </a>

        <a href="phone-cases.html">
            <span class="menu-text">PHONE CASES</span>
            <span class="menu-arrow">↗</span>
        </a>

        <a href="streed-sets.html">
            <span class="menu-text">STREED SETS</span>
            <span class="menu-arrow">↗</span>
        </a>

        <a href="streed-club.html">
            <span class="menu-text">STREED CLUB</span>
            <span class="menu-arrow">↗</span>
        </a>

    </div>

</nav>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>

const menuToggle = document.getElementById("menuToggle");
const menuPanel = document.getElementById("menuPanel");
const menuOverlay = document.getElementById("menuOverlay");


function openStreedMenu() {

    menuToggle.classList.add("active");

    menuPanel.classList.add("active");

    menuOverlay.classList.add("active");

    document.body.style.overflow = "hidden";
}


function closeStreedMenu() {

    menuToggle.classList.remove("active");

    menuPanel.classList.remove("active");

    menuOverlay.classList.remove("active");

    document.body.style.overflow = "";
}


menuToggle.addEventListener("click", function() {

    if (menuPanel.classList.contains("active")) {

        closeStreedMenu();

    } else {

        openStreedMenu();

    }

});


menuOverlay.addEventListener("click", function() {

    closeStreedMenu();

});


document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {

        closeStreedMenu();

    }

});

</script>
