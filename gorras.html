<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>STREEDHN</title>


  <style>

    /* ==================================================
       RESET
    ================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      scroll-behavior: auto;
    }


    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: #ffffff;
      padding-top: 100px;
    }


    /* ==================================================
       LOGO FIJO SUPERIOR (ENLACE A INDEX)
    ================================================== */

    .logo-link {
      position: fixed;
      z-index: 3000;
      top: max(20px, env(safe-area-inset-top));
      left: 50%;
      transform: translate3d(-50%, 0, 0);
      display: block;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }


    .logo {
      display: block;
      width: 65px;
      max-width: 25vw;
      height: auto;
    }


    /* ==================================================
       CONTROLES
    ================================================== */

    .site-controls {

      position: fixed;

      z-index: 3000;

      top:
        max(
          28px,
          env(safe-area-inset-top)
        );

      left: 0;

      width: 100%;

      padding:
        0 30px;

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      pointer-events: none;

    }

    .controls-right {

      display: flex;

      align-items: center;

      gap: 8px;

      pointer-events: auto;

    }


    /* ==================================================
       BOTONES (FIJOS EN NEGRO)
    ================================================== */

    .control-button {

      position: relative;

      width: 42px;
      height: 42px;

      padding: 0;

      border: 0;
      outline: none;

      background: transparent;

      /* Iconos fijos en color negro */
      color: #000000;

      display: flex;

      align-items: center;
      justify-content: center;

      cursor: pointer;

      pointer-events: auto;

      -webkit-tap-highlight-color:
        transparent;

      transition:
        color .25s ease,
        transform .25s ease;

    }


    .control-button:hover {

      color: #d40000;

      transform:
        scale(1.08);

    }


    .control-button.active {

      color: #d40000 !important;

    }


    /* ==================================================
       HAMBURGER
    ================================================== */

    .hamburger {

      width: 32px;

      height: 22px;

      display: flex;

      flex-direction: column;

      justify-content:
        space-between;

    }


    .hamburger span {

      display: block;

      width: 100%;

      height: 2px;

      background:
        currentColor;

      transition:
        transform .35s
        cubic-bezier(
          .22,
          1,
          .36,
          1
        ),

        opacity .25s ease;

    }


    .control-button.active
    .hamburger
    span:nth-child(1) {

      transform:
        translateY(10px)
        rotate(45deg);

    }


    .control-button.active
    .hamburger
    span:nth-child(2) {

      opacity: 0;

    }


    .control-button.active
    .hamburger
    span:nth-child(3) {

      transform:
        translateY(-10px)
        rotate(-45deg);

    }


    /* ==================================================
       ICONOS (CARRITO Y BUSCADOR)
    ================================================== */

    .cart-icon,
    .search-icon {

      width: 27px;
      height: 27px;

      fill: none;

      stroke:
        currentColor;

      stroke-width: 1.8;

      stroke-linecap: round;

      stroke-linejoin: round;

      transition:
        transform .3s ease;

    }


    .control-button:hover
    .cart-icon,
    .control-button:hover
    .search-icon {

      transform:
        scale(1.08);

    }


    /* ==================================================
       CONTADOR
    ================================================== */

    .cart-count {

      position: absolute;

      top: 0;

      right: 0;

      min-width: 17px;

      height: 17px;

      padding:
        0 4px;

      border-radius: 50%;

      background:
        #d40000;

      color:
        #ffffff;

      font-family:
        Arial,
        sans-serif;

      font-size: 10px;

      line-height: 17px;

      text-align: center;

      display: none;

    }


    /* ==================================================
       BUSCADOR PANEL
    ================================================== */

    .search-panel {

      position: fixed;

      z-index: 2500;

      top: 82px;

      right: 25px;

      width: 320px;

      max-width: calc(100vw - 50px);

      padding: 18px;

      background: rgba(0, 0, 0, .96);

      border: 1px solid #252525;

      border-top: 4px solid #d40000;

      box-shadow: 0 20px 60px rgba(0, 0, 0, .50);

      opacity: 0;

      visibility: hidden;

      transform: translateY(-20px) scale(.97);

      transform-origin: top right;

      transition: opacity .35s ease, transform .35s cubic-bezier(.22, 1, .36, 1), visibility .35s;

    }

    .search-panel.open {

      opacity: 1;

      visibility: visible;

      transform: translateY(0) scale(1);

    }

    .search-form {

      display: flex;

      gap: 8px;

    }

    .search-input {

      flex: 1;

      background: #111111;

      border: 1px solid #333333;

      color: #ffffff;

      padding: 10px 12px;

      font-family: Arial, sans-serif;

      font-size: 14px;

      outline: none;

      transition: border-color .25s ease;

    }

    .search-input:focus {

      border-color: #d40000;

    }

    .search-submit {

      background: #d40000;

      color: #ffffff;

      border: 0;

      padding: 0 15px;

      font-family: Impact, sans-serif;

      cursor: pointer;

      transition: opacity .25s ease;

    }

    .search-submit:hover {

      opacity: 0.85;

    }


    /* ==================================================
       MENU
    ================================================== */

    .menu-panel {

      position: fixed;

      z-index: 2500;

      top: 82px;

      left: 25px;

      width: 330px;

      max-width:
        calc(100vw - 50px);

      padding:
        25px 20px;

      background:
        rgba(
          0,
          0,
          0,
          .96
        );

      border:
        1px solid #252525;

      border-left:
        4px solid #d40000;

      box-shadow:
        0 20px 60px
        rgba(
          0,
          0,
          0,
          .50
        );

      opacity: 0;

      visibility: hidden;

      transform:
        translateY(-20px)
        scale(.97);

      transform-origin:
        top left;

      transition:

        opacity .35s ease,

        transform .35s
        cubic-bezier(
          .22,
          1,
          .36,
          1
        ),

        visibility .35s;

    }


    .menu-panel.open {

      opacity: 1;

      visibility: visible;

      transform:
        translateY(0)
        scale(1);

    }


    /* ==================================================
       TITULO MENU
    ================================================== */

    .menu-title {

      color:
        #d40000;

      font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        sans-serif;

      font-size: 13px;

      letter-spacing: 4px;

      margin-bottom: 12px;

    }


    /* ==================================================
       LISTA MENU
    ================================================== */

    .menu-list {

      list-style: none;

    }


    .menu-list li {

      opacity: 0;

      transform:
        translateX(-30px);

      transition:

        opacity .4s ease,

        transform .45s
        cubic-bezier(
          .22,
          1,
          .36,
          1
        );

    }


    .menu-panel.open
    .menu-list li {

      opacity: 1;

      transform:
        translateX(0);

    }


    .menu-panel.open
    .menu-list li:nth-child(1) {
      transition-delay: .05s;
    }

    .menu-panel.open
    .menu-list li:nth-child(2) {
      transition-delay: .10s;
    }

    .menu-panel.open
    .menu-list li:nth-child(3) {
      transition-delay: .15s;
    }

    .menu-panel.open
    .menu-list li:nth-child(4) {
      transition-delay: .20s;
    }

    .menu-panel.open
    .menu-list li:nth-child(5) {
      transition-delay: .25s;
    }

    .menu-panel.open
    .menu-list li:nth-child(6) {
      transition-delay: .30s;
    }


    .menu-list a {

      position: relative;

      display: block;

      padding:
        9px 8px;

      color:
        #ffffff;

      text-decoration: none;

      font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        sans-serif;

      font-size: 25px;

      letter-spacing: 1px;

      overflow: hidden;

      transition:

        color .25s ease,

        padding-left .3s ease;

    }


    .menu-list a::before {

      content: "";

      position: absolute;

      left: 0;

      bottom: 0;

      width: 0;

      height: 3px;

      background:
        #d40000;

      transition:
        width .3s ease;

    }


    .menu-list a:hover {

      color:
        #d40000;

      padding-left:
        18px;

    }


    .menu-list a:hover::before {

      width: 100%;

    }


    /* ==================================================
       CARRITO
    ================================================== */

    .cart-panel {

      position: fixed;

      z-index: 2500;

      top: 82px;

      right: 25px;

      width: 370px;

      max-width:
        calc(100vw - 50px);

      background:
        rgba(
          0,
          0,
          0,
          .97
        );

      color:
        #ffffff;

      border:
        1px solid #252525;

      border-top:
        4px solid #d40000;

      box-shadow:
        0 20px 60px
        rgba(
          0,
          0,
          0,
          .50
        );

      opacity: 0;

      visibility: hidden;

      transform:
        translateY(-20px)
        scale(.97);

      transform-origin:
        top right;

      transition:

        opacity .35s ease,

        transform .35s
        cubic-bezier(
          .22,
          1,
          .36,
          1
        ),

        visibility .35s;

    }


    .cart-panel.open {

      opacity: 1;

      visibility: visible;

      transform:
        translateY(0)
        scale(1);

    }


    /* ==================================================
       HEADER CARRITO
    ================================================== */

    .cart-header {

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      padding:
        18px 18px 15px;

      border-bottom:
        1px solid #292929;

    }


    .cart-header h2 {

      color:
        #ffffff;

      font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        sans-serif;

      font-size:
        27px;

      letter-spacing:
        1px;

    }


    .cart-close {

      border: 0;

      background:
        transparent;

      color:
        #ffffff;

      font-family:
        Arial,
        sans-serif;

      font-size:
        29px;

      line-height: 1;

      cursor: pointer;

      transition:
        color .25s ease,
        transform .25s ease;

    }


    .cart-close:hover {

      color:
        #d40000;

      transform:
        rotate(90deg);

    }


    /* ==================================================
       CONTENIDO CARRITO
    ================================================== */

    .cart-content {

      padding:
        35px 20px 30px;

      text-align:
        center;

    }


    .cart-empty-icon {

      width:
        55px;

      height:
        55px;

      margin:
        0 auto 15px;

      opacity:
        .65;

    }


    .cart-empty {

      color:
        #ffffff;

      font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        sans-serif;

      font-size:
        22px;

      letter-spacing:
        1px;

    }


    .cart-empty-subtitle {

      margin-top:
        8px;

      color:
        #777777;

      font-family:
        Arial,
        sans-serif;

      font-size:
        12px;

    }


    /* ==================================================
       ITEMS
    ================================================== */

    .cart-items {

      max-height:
        300px;

      overflow-y:
        auto;

    }


    .cart-item {

      display:
        flex;

      align-items:
        center;

      gap:
        12px;

      padding:
        13px 18px;

      border-bottom:
        1px solid #292929;

    }


    .cart-item img {

      width:
        55px;

      height:
        55px;

      object-fit:
        cover;

    }


    .cart-item-info {

      flex:
        1;

    }


    .cart-item-name {

      color:
        #ffffff;

      font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        sans-serif;

      font-size:
        16px;

    }


    .cart-item-price {

      color:
        #d40000;

      font-family:
        Arial,
        sans-serif;

      font-size:
        13px;

      margin-top:
        3px;

    }


    .cart-remove {

      border: 0;

      background:
        transparent;

      color:
        #777777;

      font-size:
        20px;

      cursor:
        pointer;

    }


    .cart-remove:hover {

      color:
        #d40000;

    }


    /* ==================================================
       FOOTER
    ================================================== */

    .cart-footer {

      display: none;

      padding:
        15px 18px;

      border-top:
        1px solid #292929;

    }


    .cart-total {

      display:
        flex;

      justify-content:
        space-between;

      font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        sans-serif;

      font-size:
        20px;

    }


    .cart-total strong {

      color:
        #d40000;

    }


    /* ==================================================
       MEDIA QUERIES (MOBILE)
    ================================================== */

    @media (max-width: 768px) {

      .site-controls {

        top:
          max(
            14px,
            env(safe-area-inset-top)
          );

        padding:
          0 14px;

      }


      .control-button {

        width:
          46px;

        height:
          46px;

      }


      .hamburger {

        width:
          27px;

        height:
          19px;

      }


      .hamburger span {

        height:
          2px;

      }


      .cart-icon,
      .search-icon {

        width:
          27px;

        height:
          27px;

      }


      .menu-panel {

        top:
          calc(
            64px +
            env(safe-area-inset-top)
          );

        left:
          12px;

        width:
          calc(
            100vw - 24px
          );

        max-width:
          none;

        padding:
          22px 16px;

      }


      .cart-panel,
      .search-panel {

        top:
          calc(
            64px +
            env(safe-area-inset-top)
          );

        right:
          12px;

        width:
          calc(
            100vw - 24px
          );

        max-width:
          none;

      }

    }

  </style>

</head>


<body>

  <!-- ==================================================
       LOGO FIJO SUPERIOR (ENLACE A INDEX.HTML)
  ================================================== -->

  <a href="index.html" class="logo-link" aria-label="Ir al inicio">
    <img
      src="images/LOGOTIPO.PNG"
      alt="Logo STREEDHN"
      class="logo"
    >
  </a>


  <!-- ==================================================
       CONTROLES (MENÚ, BUSCADOR, CARRITO)
  ================================================== -->

  <div
    class="site-controls"
  >

    <button
      class="control-button"
      id="menuButton"
      aria-label="Abrir menú"
      aria-expanded="false"
    >

      <span class="hamburger">

        <span></span>
        <span></span>
        <span></span>

      </span>

    </button>


    <div class="controls-right">

      <button
        class="control-button"
        id="searchButton"
        aria-label="Abrir buscador"
        aria-expanded="false"
      >
        <svg
          class="search-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      </button>

      <button
        class="control-button"
        id="cartButton"
        aria-label="Abrir carrito"
        aria-expanded="false"
      >

        <svg
          class="cart-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path
            d="
              M3 4
              H5
              L7.2 15.1
              A2 2 0 0 0
              9.2 16.7
              H17
              A2 2 0 0 0
              18.9 15.3
              L21 8
              H6
            "
          />

          <circle
            cx="10"
            cy="20"
            r="1.4"
          />

          <circle
            cx="18"
            cy="20"
            r="1.4"
          />

        </svg>


        <span
          class="cart-count"
          id="cartCount"
        >
          0
        </span>

      </button>

    </div>

  </div>


  <!-- ==================================================
       BUSCADOR PANEL
  ================================================== -->

  <div
    class="search-panel"
    id="searchPanel"
    aria-label="Panel de búsqueda"
  >
    <form class="search-form" id="searchForm" onsubmit="handleSearch(event)">
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="Buscar productos..."
        required
      >
      <button type="submit" class="search-submit">IR</button>
    </form>
  </div>


  <!-- ==================================================
       MENU
  ================================================== -->

  <nav
    class="menu-panel"
    id="menuPanel"
    aria-label="Menú principal"
  >

    <div
      class="menu-title"
    >
      STREEDHN / MENU
    </div>


    <ul
      class="menu-list"
    >

      <li>
        <a href="index.html">
          INICIO
        </a>
      </li>

      <li>
        <a href="#camisas">
          CAMISAS
        </a>
      </li>

      <li>
        <a href="#gorras">
          GORRAS
        </a>
      </li>

      <li>
        <a href="#phone-cases">
          PHONE CASES
        </a>
      </li>

      <li>
        <a href="#streed-sets">
          STREED SETS
        </a>
      </li>

      <li>
        <a href="#streed-club">
          STREED CLUB
        </a>
      </li>

    </ul>

  </nav>


  <!-- ==================================================
       CARRITO
  ================================================== -->

  <aside
    class="cart-panel"
    id="cartPanel"
    aria-label="Carrito de compras"
  >

    <div class="cart-header">

      <h2>
        YOUR CART
      </h2>


      <button
        class="cart-close"
        id="cartClose"
        aria-label="Cerrar carrito"
      >
        ×
      </button>

    </div>


    <div
      class="cart-content"
      id="cartContent"
    >

      <svg
        class="cart-empty-icon cart-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <path
          d="
            M3 4
            H5
            L7.2 15.1
            A2 2 0 0 0
            9.2 16.7
            H17
            A2 2 0 0 0
            18.9 15.3
            L21 8
            H6
          "
        />

        <circle
          cx="10"
          cy="20"
          r="1.4"
        />

        <circle
          cx="18"
          cy="20"
          r="1.4"
        />

      </svg>


      <div
        class="cart-empty"
      >
        TU CARRITO ESTÁ VACÍO
      </div>


      <div
        class="cart-empty-subtitle"
      >
        Aquí aparecerán tus productos.
      </div>

    </div>


    <div
      class="cart-items"
      id="cartItems"
    ></div>


    <div
      class="cart-footer"
      id="cartFooter"
    >

      <div
        class="cart-total"
      >

        <span>
          TOTAL
        </span>

        <strong
          id="cartTotal"
        >
          L 0.00
        </strong>

      </div>

    </div>

  </aside>


  <script>

    /* ==================================================
       ELEMENTOS
    ================================================== */

    const menuButton = document.getElementById("menuButton");
    const menuPanel = document.getElementById("menuPanel");
    const searchButton = document.getElementById("searchButton");
    const searchPanel = document.getElementById("searchPanel");
    const searchInput = document.getElementById("searchInput");
    const cartButton = document.getElementById("cartButton");
    const cartPanel = document.getElementById("cartPanel");
    const cartClose = document.getElementById("cartClose");


    /* ==================================================
       MENU
    ================================================== */

    menuButton.addEventListener(
      "click",
      event => {
        event.stopPropagation();
        const isOpen = menuPanel.classList.contains("open");
        menuPanel.classList.toggle("open", !isOpen);
        menuButton.classList.toggle("active", !isOpen);
        menuButton.setAttribute("aria-expanded", String(!isOpen));

        searchPanel.classList.remove("open");
        searchButton.classList.remove("active");
        searchButton.setAttribute("aria-expanded", "false");

        cartPanel.classList.remove("open");
        cartButton.classList.remove("active");
        cartButton.setAttribute("aria-expanded", "false");
      }
    );


    /* ==================================================
       BUSCADOR
    ================================================== */

    searchButton.addEventListener(
      "click",
      event => {
        event.stopPropagation();
        const isOpen = searchPanel.classList.contains("open");
        searchPanel.classList.toggle("open", !isOpen);
        searchButton.classList.toggle("active", !isOpen);
        searchButton.setAttribute("aria-expanded", String(!isOpen));

        if (!isOpen) {
          setTimeout(() => searchInput.focus(), 100);
        }

        menuPanel.classList.remove("open");
        menuButton.classList.remove("active");
        menuButton.setAttribute("aria-expanded", "false");

        cartPanel.classList.remove("open");
        cartButton.classList.remove("active");
        cartButton.setAttribute("aria-expanded", "false");
      }
    );

    function handleSearch(event) {
      event.preventDefault();
      const query = searchInput.value.trim();
      if (query) {
        alert("Buscando: " + query);
        searchPanel.classList.remove("open");
        searchButton.classList.remove("active");
        searchButton.setAttribute("aria-expanded", "false");
      }
    }


    /* ==================================================
       CARRITO
    ================================================== */

    cartButton.addEventListener(
      "click",
      event => {
        event.stopPropagation();
        const isOpen = cartPanel.classList.contains("open");
        cartPanel.classList.toggle("open", !isOpen);
        cartButton.classList.toggle("active", !isOpen);
        cartButton.setAttribute("aria-expanded", String(!isOpen));

        menuPanel.classList.remove("open");
        menuButton.classList.remove("active");
        menuButton.setAttribute("aria-expanded", "false");

        searchPanel.classList.remove("open");
        searchButton.classList.remove("active");
        searchButton.setAttribute("aria-expanded", "false");
      }
    );


    cartClose.addEventListener(
      "click",
      () => {
        cartPanel.classList.remove("open");
        cartButton.classList.remove("active");
        cartButton.setAttribute("aria-expanded", "false");
      }
    );


    /* ==================================================
       CLICK AFUERA PARA CERRAR PANELES
    ================================================== */

    document.addEventListener(
      "click",
      event => {
        if (!menuPanel.contains(event.target) && !menuButton.contains(event.target)) {
          menuPanel.classList.remove("open");
          menuButton.classList.remove("active");
          menuButton.setAttribute("aria-expanded", "false");
        }

        if (!searchPanel.contains(event.target) && !searchButton.contains(event.target)) {
          searchPanel.classList.remove("open");
          searchButton.classList.remove("active");
          searchButton.setAttribute("aria-expanded", "false");
        }

        if (!cartPanel.contains(event.target) && !cartButton.contains(event.target)) {
          cartPanel.classList.remove("open");
          cartButton.classList.remove("active");
          cartButton.setAttribute("aria-expanded", "false");
        }
      }
    );


    /* ==================================================
       LINKS MENU
    ================================================== */

    menuPanel.querySelectorAll("a").forEach(
      link => {
        link.addEventListener(
          "click",
          () => {
            menuPanel.classList.remove("open");
            menuButton.classList.remove("active");
            menuButton.setAttribute("aria-expanded", "false");
          }
        );
      }
    );

  </script>

</body>

</html>
