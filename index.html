<style>
@import url('https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap');

.streed-process {
  width:100%;
  max-width:100%;
  box-sizing:border-box;

  padding:55px 20px;

  margin:0 auto;

  background:transparent;

  overflow:hidden;

  font-family:Arial,sans-serif;

  text-align:center;
}


/* =========================
   TÍTULO
========================= */

.streed-process-title {

  width:100%;

  margin:0 auto 40px;

  padding:0;

  text-align:center;

  font-family:'Abril Fatface',Georgia,serif;

  font-size:clamp(30px,5vw,55px);

  line-height:1;

  color:#D90429;

  opacity:0;

  transform:translateY(20px);

  animation:titleIn 1s cubic-bezier(.16,1,.3,1) forwards;
}


/* =========================
   GRID
========================= */

.streed-process-grid {

  width:100%;

  max-width:900px;

  margin-left:auto;
  margin-right:auto;

  display:grid;

  grid-template-columns:repeat(2,minmax(0,1fr));

  box-sizing:border-box;
}


/* =========================
   PASOS
========================= */

.streed-step {

  position:relative;

  width:100%;
  min-width:0;

  min-height:220px;

  padding:25px 20px;

  box-sizing:border-box;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  opacity:0;

  transform:translateY(30px);

  animation:stepIn .8s cubic-bezier(.16,1,.3,1) forwards;
}


.streed-step:nth-child(1) {
  animation-delay:.2s;
}

.streed-step:nth-child(2) {
  animation-delay:.4s;
}

.streed-step:nth-child(3) {
  animation-delay:.6s;
}

.streed-step:nth-child(4) {
  animation-delay:.8s;
}


/* =========================
   NÚMEROS
========================= */

.streed-number {

  position:relative;

  display:inline-block;

  width:max-content;

  margin:0 auto 22px;

  padding:0;

  font-family:'Abril Fatface',Georgia,serif;

  font-size:clamp(65px,9vw,100px);

  line-height:.75;

  color:#D90429;

  opacity:.17;

  text-align:center;

  transition:opacity .4s ease;
}


/* BARRIDO DE LUZ */

.streed-number::after {

  content:"";

  position:absolute;

  top:-25%;

  left:-70%;

  width:35%;

  height:150%;

  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0),
    rgba(255,255,255,.9),
    rgba(255,255,255,0),
    transparent
  );

  transform:skewX(-18deg);

  opacity:0;

  animation:numberScan 4s ease-in-out infinite;
}


/* DIFERENTES TIEMPOS */

.streed-step:nth-child(1) .streed-number::after {
  animation-delay:1.5s;
}

.streed-step:nth-child(2) .streed-number::after {
  animation-delay:2.1s;
}

.streed-step:nth-child(3) .streed-number::after {
  animation-delay:2.7s;
}

.streed-step:nth-child(4) .streed-number::after {
  animation-delay:3.3s;
}


/* =========================
   TÍTULO PASO
========================= */

.streed-step-title {

  margin:0 0 12px;

  padding:0;

  font-family:'Abril Fatface',Georgia,serif;

  font-size:clamp(22px,3vw,32px);

  line-height:1;

  color:#D90429;

  letter-spacing:.5px;

  text-align:center;

  transition:transform .3s ease;
}


/* =========================
   DESCRIPCIÓN
========================= */

.streed-step-text {

  width:100%;

  max-width:230px;

  margin:0 auto;

  padding:0;

  font-size:12px;

  line-height:1.5;

  color:#000000;

  opacity:.6;

  text-align:center;
}


/* =========================
   SEPARADORES
========================= */

.streed-step:nth-child(1)::after,
.streed-step:nth-child(3)::after {

  content:"";

  position:absolute;

  right:0;

  top:20%;

  width:1px;

  height:60%;

  background:#D90429;

  opacity:.2;
}


.streed-step:nth-child(1)::before,
.streed-step:nth-child(2)::before {

  content:"";

  position:absolute;

  left:12%;

  right:12%;

  bottom:0;

  height:1px;

  background:#D90429;

  opacity:.2;
}


/* =========================
   EFECTO HOVER
========================= */

.streed-step:hover .streed-number {

  opacity:1;

  transform:scale(1.04);
}

.streed-step:hover .streed-step-title {

  transform:translateY(-3px);
}


/* =========================
   ANIMACIONES
========================= */

@keyframes titleIn {

  to {
    opacity:1;
    transform:translateY(0);
  }
}


@keyframes stepIn {

  to {
    opacity:1;
    transform:translateY(0);
  }
}


/* ✨ BARRIDO */

@keyframes numberScan {

  0%,45% {
    left:-70%;
    opacity:0;
  }

  50% {
    opacity:1;
  }

  70% {
    left:125%;
    opacity:1;
  }

  75%,100% {
    left:125%;
    opacity:0;
  }
}


/* =========================
   📱 MÓVIL
========================= */

@media(max-width:600px) {

  .streed-process {

    padding:40px 10px;
  }

  .streed-process-title {

    margin-bottom:25px;

    font-size:32px;
  }

  .streed-process-grid {

    width:100%;

    max-width:500px;

    margin-left:auto;
    margin-right:auto;

    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .streed-step {

    min-height:180px;

    padding:20px 10px;
  }

  .streed-number {

    font-size:52px;

    margin-bottom:17px;
  }

  .streed-step-title {

    font-size:19px;

    margin-bottom:9px;
  }

  .streed-step-text {

    max-width:140px;

    font-size:9px;

    line-height:1.45;
  }

}


/* =========================
   📱 MÓVIL PEQUEÑO
========================= */

@media(max-width:380px) {

  .streed-process {

    padding-left:5px;
    padding-right:5px;
  }

  .streed-process-grid {

    width:100%;
  }

  .streed-step {

    min-height:165px;

    padding:17px 6px;
  }

  .streed-number {

    font-size:46px;
  }

  .streed-step-title {

    font-size:17px;
  }

  .streed-step-text {

    font-size:8px;

    max-width:120px;
  }

}
</style>


<section class="streed-process">

  <h2 class="streed-process-title">
    ASÍ FUNCIONA
  </h2>


  <div class="streed-process-grid">


    <!-- 01 -->

    <div class="streed-step">

      <div class="streed-number">
        01
      </div>

      <h3 class="streed-step-title">
        ELIGE
      </h3>

      <p class="streed-step-text">
        Escoge lo que quieres personalizar.
      </p>

    </div>


    <!-- 02 -->

    <div class="streed-step">

      <div class="streed-number">
        02
      </div>

      <h3 class="streed-step-title">
        PERSONALIZA
      </h3>

      <p class="streed-step-text">
        Cuéntanos tu idea o envíanos tu diseño.
      </p>

    </div>


    <!-- 03 -->

    <div class="streed-step">

      <div class="streed-number">
        03
      </div>

      <h3 class="streed-step-title">
        CREAMOS
      </h3>

      <p class="streed-step-text">
        Convertimos tu idea en algo real.
      </p>

    </div>


    <!-- 04 -->

    <div class="streed-step">

      <div class="streed-number">
        04
      </div>

      <h3 class="streed-step-title">

      </h3>

      <p class="streed-step-text">
        Recibe algo hecho especialmente para ti.
      </p>

    </div>


  </div>

</section>
