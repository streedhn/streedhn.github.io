
<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- MARCADOR DE LA PÁGINA -->
    <link rel="icon" type="image/png" href="images/ENCABEZADO.PNG">

    <title>STREED STUDIO PRINT</title>

    <style>

        /* =====================================
           CONFIGURACIÓN GENERAL
        ===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            color: #000000;
            overflow-x: hidden;

            /* Animación de entrada */
            animation: entrada 0.7s ease-out;
        }


        /* =====================================
           ANIMACIÓN DE ENTRADA
        ===================================== */

        @keyframes entrada {

            0% {
                opacity: 0;
                transform: translateY(-18px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =====================================
           HEADER
        ===================================== */

        .header {

            width: 100%;
            min-height: 190px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            padding: 30px 100px;

            background: #ffffff;
        }


        /* =====================================
           LOGOTIPO
        ===================================== */

        .logo-link {

            position: absolute;

            left: 45px;
            top: 50%;

            transform: translateY(-50%);

            z-index: 10;
        }


        .logo {

            width: 85px;
            height: 85px;

            object-fit: contain;

            display: block;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                filter 0.25s ease;
        }


        .logo:hover {

            transform: scale(1.08) rotate(-3deg);

            filter:
                drop-shadow(4px 4px 0px #e00000);
        }


        /* =====================================
           CONTENEDOR DEL TÍTULO
        ===================================== */

        .title-container {

            display: inline-block;

            position: relative;
        }


        /* =====================================
           TÍTULO
        ===================================== */

        .title {

            font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;

            font-size: clamp(42px, 6vw, 82px);

            font-weight: normal;

            font-style: italic;

            letter-spacing: 1px;

            text-align: center;

            white-space: nowrap;

            /* COLOR INICIAL */
            color: #000000;

            /* FLASH DE COLOR */
            animation: flashTexto 1.8s infinite;

            /* Hace que el cambio de color sea más agresivo */
            text-shadow:
                0 0 0 transparent;
        }


        /* =====================================
           FLASH DE LAS LETRAS

           NEGRO → ROJO → NEGRO
        ===================================== */

        @keyframes flashTexto {

            /* NEGRO */
            0% {
                color: #000000;
                text-shadow:
                    0 0 0 transparent;
            }

            /* ROJO MUY RÁPIDO */
            4% {
                color: #ff0000;
                text-shadow:
                    0 0 8px rgba(255, 0, 0, 0.8),
                    0 0 18px rgba(255, 0, 0, 0.5);
            }

            /* ROJO INTENSO */
            7% {
                color: #ff0000;
                text-shadow:
                    0 0 12px rgba(255, 0, 0, 0.9),
                    0 0 25px rgba(255, 0, 0, 0.6);
            }

            /* VUELVE A NEGRO */
            10% {
                color: #000000;
                text-shadow:
                    0 0 0 transparent;
            }

            /* NEGRO */
            100% {
                color: #000000;
                text-shadow:
                    0 0 0 transparent;
            }

        }


        /* =====================================
           SEGUNDO FLASH

           Un destello aún más rápido
        ===================================== */

        .title::after {

            content: "STREED STUDIO PRINT";

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;

            color: #ff0000;

            opacity: 0;

            pointer-events: none;

            animation: segundoFlash 1.8s infinite;

        }


        @keyframes segundoFlash {

            0% {
                opacity: 0;
            }

            4% {
                opacity: 0.8;
            }

            6% {
                opacity: 0;
            }

            100% {
                opacity: 0;
            }

        }


        /* =====================================
           LÍNEA DIVISORA
        ===================================== */

        .divider {

            width: 0%;

            height: 4px;

            margin: 0 auto;

            background:
                linear-gradient(
                    90deg,
                    #000000 0%,
                    #000000 75%,
                    #e00000 75%,
                    #e00000 100%
                );

            animation:
                lineaEntrada 0.9s ease-out 0.5s forwards;
        }


        @keyframes lineaEntrada {

            from {
                width: 0%;
            }

            to {
                width: 92%;
            }

        }


        /* =====================================
           FLASH DE ENTRADA DEL HEADER
        ===================================== */

        .header::after {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background:
                rgba(255, 0, 0, 0.06);

            pointer-events: none;

            animation: entradaFlash 0.9s ease-out;
        }


        @keyframes entradaFlash {

            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }

        }


        /* =====================================
           RESPONSIVE
        ===================================== */

        @media (max-width: 700px) {

            .header {

                min-height: 160px;

                padding:
                    25px
                    20px
                    25px
                    90px;
            }


            .logo-link {

                left: 18px;
            }


            .logo {

                width: 60px;
                height: 60px;
            }


            .title {

                font-size:
                    clamp(28px, 8vw, 48px);

                letter-spacing: 0;
            }


            .divider {

                height: 3px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         ENCABEZADO
    ===================================== -->

    <header class="header">


        <!-- LOGOTIPO / BOTÓN PARA VOLVER AL INICIO -->

        <a
            href="index.html"
            class="logo-link"
            aria-label="Volver al inicio"
        >

            <img
                src="images/LOGOTIPO.PNG"
                alt="STREED"
                class="logo"
            >

        </a>


        <!-- TÍTULO -->

        <div class="title-container">

            <h1 class="title">
                STREED STUDIO PRINT
            </h1>

        </div>


    </header>


    <!-- =====================================
         LÍNEA DIVISORA
    ===================================== -->

    <div class="divider"></div>


</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STREED MENU</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #ffffff;
    font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
}


/* =========================
   MENU PRINCIPAL
========================= */

.menu {
    width: 100%;
    background: white;
    padding: 20px 15px;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* CONTENEDOR DE LINKS */

.menu ul {
    list-style: none;

    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;

    flex-wrap: nowrap;
    white-space: nowrap;

    margin: 0;
    padding: 0;
}


/* CADA ELEMENTO */

.menu li {
    display: flex;
    align-items: center;
    justify-content: center;

    white-space: nowrap;
}


/* =========================
   LINKS
========================= */

.menu a {

    position: relative;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    color: #000;

    text-decoration: none;

    font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;

    font-size: clamp(15px, 1.8vw, 24px);

    letter-spacing: 1px;

    padding: 6px 12px;

    white-space: nowrap;

    transition:
        color 0.2s ease,
        transform 0.2s ease,
        letter-spacing 0.2s ease;
}


/* =========================
   MOVIMIENTO STREED
========================= */

.menu a:hover {

    color: #e60000;

    transform: translateY(-4px) skewX(-5deg);

    letter-spacing: 2px;
}


/* =========================
   LINEA ROJA
========================= */

.menu a::after {

    content: "";

    position: absolute;

    left: 12px;
    right: 12px;

    bottom: 0;

    height: 3px;

    background: #e60000;

    transform: scaleX(0);

    transform-origin: center;

    transition: transform 0.2s ease;
}


.menu a:hover::after,
.menu a.active::after {

    transform: scaleX(1);
}


/* =========================
   PAGINA ACTUAL
========================= */

.menu a.active {

    color: #e60000;

    transform: skewX(-5deg);
}


/* =========================
   SEPARADORES /
========================= */

.separador {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    font-family: Arial, sans-serif;

    font-size: 17px;

    font-weight: bold;

    line-height: 1;

    color: #000;

    margin: 0 1px;

    padding: 0;

    height: auto;

    user-select: none;
}


/* CAMBIA A ROJO AL PASAR */

.menu li:hover .separador {

    color: #e60000;

    transform: skewX(-5deg);
}


/* =========================
   ANIMACION SUAVE
========================= */

.menu li {

    transition: transform 0.2s ease;
}


/* =========================
   TABLET
========================= */

@media (max-width: 900px) {

    .menu {
        padding: 18px 8px;
    }

    .menu a {
        font-size: 15px;
        padding: 6px 8px;
    }

    .separador {
        font-size: 15px;
    }
}


/* =========================
   CELULAR
========================= */

@media (max-width: 700px) {

    .menu {
        padding: 16px 4px;
    }

    .menu a {
        font-size: 12px;
        padding: 5px 5px;
        letter-spacing: 0.5px;
    }

    .menu a:hover {
        letter-spacing: 1px;
    }

    .menu a::after {
        left: 5px;
        right: 5px;
        height: 2px;
    }

    .separador {
        font-size: 12px;
        margin: 0;
    }
}


/* =========================
   CELULARES PEQUEÑOS
========================= */

@media (max-width: 430px) {

    .menu {
        padding: 14px 2px;
    }

    .menu a {
        font-size: 10px;
        padding: 4px 3px;
        letter-spacing: 0;
    }

    .menu a:hover {
        letter-spacing: 0.5px;
    }

    .menu a::after {
        left: 3px;
        right: 3px;
        height: 2px;
    }

    .separador {
        font-size: 10px;
    }
}

</style>
</head>


<body>


<!-- =========================
     MENU STREED
========================= -->

<nav class="menu">

    <ul>

        <li>
            <a href="index.html">INICIO</a>
        </li>

        <li>
            <span class="separador">/</span>
            <a href="camisas.html">CAMISAS</a>
        </li>

        <li>
            <span class="separador">/</span>
            <a href="gorras.html">GORRAS</a>
        </li>

        <li>
            <span class="separador">/</span>
            <a href="phone-cases.html">PHONE CASES</a>
        </li>

        <li>
            <span class="separador">/</span>
            <a href="streed-sets.html">STREED SETS</a>
        </li>

        <li>
            <span class="separador">/</span>
            <a href="streed-club.html">STREED CLUB</a>
        </li>

    </ul>

</nav>


<script>

/* =========================
   DETECTAR PAGINA ACTUAL
========================= */

const paginaActual =
    window.location.pathname.split("/").pop() || "index.html";


document.querySelectorAll(".menu a").forEach(link => {

    const paginaLink = link.getAttribute("href");

    if (paginaLink === paginaActual) {

        link.classList.add("active");

    }

});

</script>


</body>
</html>
