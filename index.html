    <style>

        /* =====================================
           CONFIGURACIÓN GENERAL
        ===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #ffffff;
            color: #000000;
            overflow-x: hidden;

            animation: entrada 0.7s ease-out;
        }


        /* =====================================
           ANIMACIÓN DE ENTRADA
        ===================================== */

        @keyframes entrada {

            0% {
                opacity: 0;
                transform: translateY(-18px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =====================================
           HEADER
        ===================================== */

        .header {

            width: 100%;
            min-height: 190px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            padding: 30px 100px;

            background: #ffffff;

            z-index: 100;
        }


        /* =====================================
           CONTENEDOR DEL TÍTULO
        ===================================== */

        .title-container {

            display: inline-block;

            position: relative;
        }


        /* =====================================
           TÍTULO
        ===================================== */

        .title {

            font-family:
                Impact,
                Haettenschweiler,
                "Arial Narrow Bold",
                sans-serif;

            font-size: clamp(42px, 6vw, 82px);

            font-weight: normal;

            font-style: italic;

            letter-spacing: 1px;

            text-align: center;

            white-space: nowrap;

            color: #000000;

            animation: flashTexto 1.8s infinite;

            text-shadow:
                0 0 0 transparent;
        }


        /* =====================================
           FLASH DE LAS LETRAS
        ===================================== */

        @keyframes flashTexto {

            0% {

                color: #000000;

                text-shadow:
                    0 0 0 transparent;
            }

            4% {

                color: #ff0000;

                text-shadow:
                    0 0 8px rgba(255, 0, 0, 0.8),
                    0 0 18px rgba(255, 0, 0, 0.5);
            }

            7% {

                color: #ff0000;

                text-shadow:
                    0 0 12px rgba(255, 0, 0, 0.9),
                    0 0 25px rgba(255, 0, 0, 0.6);
            }

            10% {

                color: #000000;

                text-shadow:
                    0 0 0 transparent;
            }

            100% {

                color: #000000;

                text-shadow:
                    0 0 0 transparent;
            }

        }


        /* =====================================
           SEGUNDO FLASH
        ===================================== */

        .title::after {

            content: "STREED STUDIO PRINT";

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;

            color: #ff0000;

            opacity: 0;

            pointer-events: none;

            animation: segundoFlash 1.8s infinite;
        }


        @keyframes segundoFlash {

            0% {
                opacity: 0;
            }

            4% {
                opacity: 0.8;
            }

            6% {
                opacity: 0;
            }

            100% {
                opacity: 0;
            }

        }


        /* =====================================
           LÍNEA DIVISORA
        ===================================== */

        .divider {

            width: 0%;

            height: 4px;

            margin: 0 auto;

            background:
                linear-gradient(
                    90deg,
                    #000000 0%,
                    #000000 75%,
                    #e00000 75%,
                    #e00000 100%
                );

            animation:
                lineaEntrada 0.9s ease-out 0.5s forwards;

            position: relative;

            z-index: 20;
        }


        @keyframes lineaEntrada {

            from {
                width: 0%;
            }

            to {
                width: 92%;
            }

        }


        /* =====================================
           FLASH DE ENTRADA DEL HEADER
        ===================================== */

        .header::after {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background:
                rgba(255, 0, 0, 0.06);

            pointer-events: none;

            animation: entradaFlash 0.9s ease-out;
        }


        @keyframes entradaFlash {

            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }

        }


        /* =====================================
           RESPONSIVE
        ===================================== */

        @media (max-width: 1024px) {

            .header {

                min-height: 160px;

                padding:
                    25px
                    20px;
            }

            .title {

                font-size:
                    clamp(30px, 7vw, 58px);

                letter-spacing: 0;
            }

        }


        @media (max-width: 700px) {

            .header {

                min-height: 145px;

                padding:
                    25px
                    15px;
            }

            .title {

                font-size:
                    clamp(27px, 9vw, 46px);
            }

            .divider {

                height: 3px;
            }

        }


        @media (max-width: 430px) {

            .header {

                min-height: 135px;
            }

            .title {

                font-size:
                    clamp(24px, 9vw, 40px);
            }

        }

    </style>

</head>


<body>

<style>

/* =========================
   BOTÓN
========================= */

.streed-menu-button {

    position: fixed;

    top: 22px;
    left: 22px;

    width: 48px;
    height: 48px;

    border: 2px solid black;

    background: white;

    cursor: pointer;

    z-index: 10001;

    display: flex;
    flex-direction: column;

    justify-content: center;

    gap: 6px;

    padding: 11px;

    transition:
        background 0.3s ease,
        transform 0.3s ease;
}


.streed-menu-button:hover {

    background: #ff0000;

    transform: rotate(-3deg);
}


.streed-menu-button span {

    display: block;

    width: 100%;
    height: 3px;

    background: black;

    transition:
        transform 0.4s cubic-bezier(.77,0,.18,1),
        opacity 0.3s ease,
        background 0.3s ease;
}


.streed-menu-button:hover span {

    background: white;
}


/* =========================
   X
========================= */

.streed-menu-button.active {

    background: #ff0000;

    border-color: #ff0000;

    transform: rotate(0deg);
}


.streed-menu-button.active span {

    background: white;
}


.streed-menu-button.active span:nth-child(1) {

    transform:
        translateY(9px)
        rotate(45deg);
}


.streed-menu-button.active span:nth-child(2) {

    opacity: 0;

    transform: scaleX(0);
}


.streed-menu-button.active span:nth-child(3) {

    transform:
        translateY(-9px)
        rotate(-45deg);
}


/* =========================
   OVERLAY
========================= */

.streed-overlay {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.45);

    backdrop-filter: blur(3px);

    opacity: 0;

    visibility: hidden;

    z-index: 9998;

    transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
}


.streed-overlay.active {

    opacity: 1;

    visibility: visible;
}


/* =========================
   MENÚ
========================= */

.streed-menu {

    position: fixed;

    top: 0;
    left: 0;

    width: 350px;
    max-width: 82vw;

    height: 100vh;

    background: white;

    color: black;

    z-index: 10000;

    box-sizing: border-box;

    padding:
        105px
        38px
        30px;

    display: flex;

    flex-direction: column;

    transform: translateX(-105%);

    transition:
        transform 0.65s cubic-bezier(.77,0,.18,1);

    overflow: hidden;
}


/* barra roja lateral */

.streed-menu::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 7px;
    height: 100%;

    background: #ff0000;

    transform: scaleY(0);

    transform-origin: top;

    transition:
        transform 0.8s cubic-bezier(.77,0,.18,1);
}


.streed-menu.active {

    transform: translateX(0);
}


.streed-menu.active::before {

    transform: scaleY(1);
}


/* =========================
   LINKS
========================= */

.streed-links {

    display: flex;

    flex-direction: column;

    width: 100%;
}


.streed-links a {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: space-between;

    text-decoration: none;

    color: black;

    padding: 17px 0;

    border-bottom: 2px solid #111;

    overflow: hidden;

    opacity: 0;

    transform: translateX(-50px);

    transition:
        opacity 0.5s ease,
        transform 0.5s ease;
}


/* =========================
   ANIMACIÓN INDIVIDUAL
========================= */

.streed-menu.active .streed-links a:nth-child(1) {

    opacity: 1;
    transform: translateX(0);

    transition-delay: 0.20s;
}


.streed-menu.active .streed-links a:nth-child(2) {

    opacity: 1;
    transform: translateX(0);

    transition-delay: 0.27s;
}


.streed-menu.active .streed-links a:nth-child(3) {

    opacity: 1;
    transform: translateX(0);

    transition-delay: 0.34s;
}


.streed-menu.active .streed-links a:nth-child(4) {

    opacity: 1;
    transform: translateX(0);

    transition-delay: 0.41s;
}


.streed-menu.active .streed-links a:nth-child(5) {

    opacity: 1;
    transform: translateX(0);

    transition-delay: 0.48s;
}


.streed-menu.active .streed-links a:nth-child(6) {

    opacity: 1;
    transform: translateX(0);

    transition-delay: 0.55s;
}


/* =========================
   LÍNEA ROJA
========================= */

.streed-links a::before {

    content: "";

    position: absolute;

    bottom: 0;
    left: 0;

    width: 0;
    height: 4px;

    background: #ff0000;

    transition:
        width 0.35s cubic-bezier(.77,0,.18,1);
}


.streed-links a:hover::before {

    width: 100%;
}


/* =========================
   TEXTO
========================= */

.menu-text {

    font-family: Impact, sans-serif;

    font-size: 29px;

    letter-spacing: 1px;

    transition:
        transform 0.35s cubic-bezier(.77,0,.18,1),
        color 0.25s ease;
}


.streed-links a:hover .menu-text {

    color: #ff0000;

    transform: translateX(10px);
}


/* =========================
   FLECHA
========================= */

.menu-arrow {

    font-family: Arial, sans-serif;

    font-size: 22px;

    color: black;

    transform: translateX(-10px);

    opacity: 0;

    transition:
        transform 0.3s ease,
        opacity 0.3s ease,
        color 0.3s ease;
}


.streed-links a:hover .menu-arrow {

    transform: translateX(0);

    opacity: 1;

    color: #ff0000;
}


/* =========================
   MÓVIL
========================= */

@media (max-width: 600px) {

    .streed-menu-button {

        top: 15px;
        left: 15px;

        width: 44px;
        height: 44px;

        padding: 10px;
    }


    .streed-menu {

        width: 310px;

        max-width: 85vw;

        padding:
            95px
            30px
            25px;
    }


    .menu-text {

        font-size: 26px;
    }


    .streed-links a {

        padding: 15px 0;
    }

}


/* =========================
   TELÉFONOS PEQUEÑOS
========================= */

@media (max-width: 400px) {

    .streed-menu {

        width: 285px;

        padding-left: 27px;
        padding-right: 27px;
    }


    .menu-text {

        font-size: 24px;
    }

}

</style>


<script>

/* =========================
   STREED MENU JS
========================= */

const menuToggle = document.getElementById("menuToggle");

const menuPanel = document.getElementById("menuPanel");

const menuOverlay = document.getElementById("menuOverlay");


function openStreedMenu() {

    menuToggle.classList.add("active");

    menuPanel.classList.add("active");

    menuOverlay.classList.add("active");

    document.body.style.overflow = "hidden";
}


function closeStreedMenu() {

    menuToggle.classList.remove("active");

    menuPanel.classList.remove("active");

    menuOverlay.classList.remove("active");

    document.body.style.overflow = "";
}


menuToggle.addEventListener("click", function() {

    if (menuPanel.classList.contains("active")) {

        closeStreedMenu();

    } else {

        openStreedMenu();

    }

});


menuOverlay.addEventListener("click", function() {

    closeStreedMenu();

});


document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {

        closeStreedMenu();

    }

});

</script>
