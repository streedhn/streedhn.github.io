<div class="streed-header">
  <h1 id="streed-title">STREED PRINT STUDIO</h1>
  <div class="light-sweep"></div>
  <div class="flash"></div>
</div>

<style>
  .streed-header {
    position: relative;
    width: 100%;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: transparent;
  }

  #streed-title {
    position: relative;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(28px, 5vw, 58px);
    font-weight: 900;
    letter-spacing: 5px;
    color: #111111;
    text-align: center;
    z-index: 2;
  }

  /* Rayo que atraviesa el texto */
  .light-sweep {
    position: absolute;
    top: 50%;
    left: -25%;
    width: 25%;
    height: 3px;
    transform: translateY(-50%) rotate(-8deg);
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,0.5),
      #ffffff,
      rgba(255,255,255,0.9),
      transparent
    );
    box-shadow:
      0 0 5px #ffffff,
      0 0 12px #ffffff,
      0 0 25px rgba(255,255,255,0.9);
    z-index: 3;
    animation: sweep 3.5s ease-in-out infinite;
  }

  /* Destello final */
  .flash {
    position: absolute;
    right: 7%;
    top: 50%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: white;
    transform: translateY(-50%);
    opacity: 0;
    z-index: 4;
    box-shadow:
      0 0 5px white,
      0 0 15px white,
      0 0 30px white,
      0 0 50px white;
    animation: flash 3.5s ease-in-out infinite;
  }

  @keyframes sweep {
    0% {
      left: -30%;
      opacity: 0;
    }

    8% {
      opacity: 1;
    }

    65% {
      opacity: 1;
    }

    78% {
      left: 105%;
      opacity: 1;
    }

    82% {
      left: 110%;
      opacity: 0;
    }

    100% {
      left: 110%;
      opacity: 0;
    }
  }

  @keyframes flash {
    0%,
    75% {
      opacity: 0;
      transform: translateY(-50%) scale(0.5);
    }

    79% {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }

    83% {
      opacity: 0;
      transform: translateY(-50%) scale(4);
    }

    100% {
      opacity: 0;
    }
  }

  /* Ajuste para celular */
  @media (max-width: 600px) {
    .streed-header {
      height: 90px;
    }

    #streed-title {
      font-size: 24px;
      letter-spacing: 3px;
    }
  }
</style>
