<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Icono de la página -->
    <link rel="icon" type="image/png" href="images/IMG_1601.PNG">

    <title>STREED PRINT STUDIO</title>
</head>

<body>

<header class="streed-header">

    <!-- Logotipo -->
    <img
        src="images/IMG_1600.PNG"
        alt="STREED HN"
        class="streed-logo"
    >

    <!-- Título -->
    <h1>STREED PRINT STUDIO</h1>

    <!-- Rayo -->
    <div class="light-sweep"></div>

    <!-- Destello -->
    <div class="flash"></div>

</header>

<!-- Línea divisoria -->
<div class="divider"></div>


<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: transparent;
    }


    /* =========================
       ENCABEZADO
       ========================= */

    .streed-header {
        position: relative;
        width: 100%;
        height: 125px;

        display: flex;
        align-items: center;
        justify-content: center;

        overflow: hidden;
    }


    /* =========================
       LOGOTIPO
       ========================= */

    .streed-logo {
        position: absolute;

        left: 25px;
        top: 50%;

        transform: translateY(-50%);

        width: 75px;
        height: 75px;

        object-fit: contain;

        z-index: 2;
    }


    /* =========================
       TITULO
       ========================= */

    .streed-header h1 {
        position: relative;

        margin: 0;

        font-family:
            Impact,
            Haettenschweiler,
            "Arial Narrow Bold",
            sans-serif;

        font-size: 45px;
        font-weight: normal;

        letter-spacing: 3px;

        color: #111111;

        text-align: center;

        z-index: 2;
    }


    /* =========================
       RAYO
       ========================= */

    .light-sweep {
        position: absolute;

        top: 50%;
        left: -30%;

        width: 22%;
        height: 3px;

        transform:
            translateY(-50%)
            rotate(-8deg);

        background: linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.4),
            #ffffff,
            rgba(255,255,255,0.9),
            transparent
        );

        box-shadow:
            0 0 5px #ffffff,
            0 0 12px #ffffff,
            0 0 25px rgba(255,255,255,0.9);

        z-index: 3;

        animation:
            sweep 3.5s ease-in-out infinite;
    }


    /* =========================
       DESTELLO
       ========================= */

    .flash {
        position: absolute;

        right: 5%;
        top: 50%;

        width: 6px;
        height: 6px;

        border-radius: 50%;

        background: white;

        opacity: 0;

        z-index: 4;

        box-shadow:
            0 0 5px white,
            0 0 15px white,
            0 0 30px white,
            0 0 50px white;

        animation:
            flash 3.5s ease-in-out infinite;
    }


    /* =========================
       LINEA DIVISORIA
       ========================= */

    .divider {
        width: 100%;
        height: 1px;

        background: #111111;
    }


    /* =========================
       ANIMACION DEL RAYO
       ========================= */

    @keyframes sweep {

        0% {
            left: -30%;
            opacity: 0;
        }

        8% {
            opacity: 1;
        }

        65% {
            opacity: 1;
        }

        78% {
            left: 105%;
            opacity: 1;
        }

        82% {
            left: 110%;
            opacity: 0;
        }

        100% {
            left: 110%;
            opacity: 0;
        }
    }


    /* =========================
       ANIMACION DEL DESTELLO
       ========================= */

    @keyframes flash {

        0%,
        75% {
            opacity: 0;
            transform:
                translateY(-50%)
                scale(0.5);
        }

        79% {
            opacity: 1;
            transform:
                translateY(-50%)
                scale(1);
        }

        83% {
            opacity: 0;
            transform:
                translateY(-50%)
                scale(4);
        }

        100% {
            opacity: 0;
        }
    }


    /* =========================
       MOVIL
       ========================= */

    @media (max-width: 600px) {

        .streed-header {
            height: 105px;
        }

        .streed-logo {
            left: 12px;

            width: 55px;
            height: 55px;
        }

        .streed-header h1 {
            font-size: 45px;
            letter-spacing: 1px;

            transform: scale(0.72);
            white-space: nowrap;
        }
    }

</style>

</body>
</html>
