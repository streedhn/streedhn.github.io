<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- MARCADOR DE LA PÁGINA -->
    <link rel="icon" type="image/png" href="images/ENCABEZADO.PNG">

    <title>STREED STUDIO PRINT</title>

    <style>

        /* =====================================
           CONFIGURACIÓN GENERAL
        ===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #ffffff;
            color: #000000;
            overflow-x: hidden;

            animation: entrada 0.7s ease-out;
        }


        /* =====================================
           ANIMACIÓN DE ENTRADA
        ===================================== */

        @keyframes entrada {

            0% {
                opacity: 0;
                transform: translateY(-18px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =====================================
           HEADER
        ===================================== */

        .header {

            width: 100%;
            min-height: 190px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            padding: 30px 100px;

            background: #ffffff;

            z-index: 100;
        }


        /* =====================================
           CONTENEDOR DEL TÍTULO
        ===================================== */

        .title-container {

            display: inline-block;

            position: relative;
        }


        /* =====================================
           TÍTULO
        ===================================== */

        .title {

            font-family:
                Impact,
                Haettenschweiler,
                "Arial Narrow Bold",
                sans-serif;

            font-size: clamp(42px, 6vw, 82px);

            font-weight: normal;

            font-style: italic;

            letter-spacing: 1px;

            text-align: center;

            white-space: nowrap;

            color: #000000;

            animation: flashTexto 1.8s infinite;

            text-shadow:
                0 0 0 transparent;
        }


        /* =====================================
           FLASH DE LAS LETRAS
        ===================================== */

        @keyframes flashTexto {

            0% {

                color: #000000;

                text-shadow:
                    0 0 0 transparent;
            }

            4% {

                color: #ff0000;

                text-shadow:
                    0 0 8px rgba(255, 0, 0, 0.8),
                    0 0 18px rgba(255, 0, 0, 0.5);
            }

            7% {

                color: #ff0000;

                text-shadow:
                    0 0 12px rgba(255, 0, 0, 0.9),
                    0 0 25px rgba(255, 0, 0, 0.6);
            }

            10% {

                color: #000000;

                text-shadow:
                    0 0 0 transparent;
            }

            100% {

                color: #000000;

                text-shadow:
                    0 0 0 transparent;
            }

        }


        /* =====================================
           SEGUNDO FLASH
        ===================================== */

        .title::after {

            content: "STREED STUDIO PRINT";

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;

            color: #ff0000;

            opacity: 0;

            pointer-events: none;

            animation: segundoFlash 1.8s infinite;
        }


        @keyframes segundoFlash {

            0% {
                opacity: 0;
            }

            4% {
                opacity: 0.8;
            }

            6% {
                opacity: 0;
            }

            100% {
                opacity: 0;
            }

        }


        /* =====================================
           LÍNEA DIVISORA
        ===================================== */

        .divider {

            width: 0%;

            height: 4px;

            margin: 0 auto;

            background:
                linear-gradient(
                    90deg,
                    #000000 0%,
                    #000000 75%,
                    #e00000 75%,
                    #e00000 100%
                );

            animation:
                lineaEntrada 0.9s ease-out 0.5s forwards;

            position: relative;

            z-index: 20;
        }


        @keyframes lineaEntrada {

            from {
                width: 0%;
            }

            to {
                width: 92%;
            }

        }


        /* =====================================
           FLASH DE ENTRADA DEL HEADER
        ===================================== */

        .header::after {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background:
                rgba(255, 0, 0, 0.06);

            pointer-events: none;

            animation: entradaFlash 0.9s ease-out;
        }


        @keyframes entradaFlash {

            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }

        }


        /* =====================================
           MENU
           
           PC = HORIZONTAL
        ===================================== */

        .menu {

            width: 100%;

            background: #ffffff;

            padding: 20px 15px;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: visible;

            position: relative;

            z-index: 500;
        }


        /* =====================================
           LISTA
        ===================================== */

        .menu ul {

            list-style: none;

            display: flex;

            flex-direction: row;

            align-items: center;

            justify-content: center;

            flex-wrap: nowrap;

            white-space: nowrap;

            margin: 0;

            padding: 0;
        }


        /* =====================================
           ELEMENTOS
        ===================================== */

        .menu li {

            display: flex;

            align-items: center;

            justify-content: center;

            white-space: nowrap;

            transition:
                transform 0.2s ease;
        }


        /* =====================================
           LINKS
        ===================================== */

        .menu a {

            position: relative;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            color: #000000;

            text-decoration: none;

            font-family:
                Impact,
                Haettenschweiler,
                "Arial Narrow Bold",
                sans-serif;

            font-size: clamp(15px, 1.8vw, 24px);

            letter-spacing: 1px;

            padding: 6px 12px;

            white-space: nowrap;

            transition:
                color 0.2s ease,
                transform 0.2s ease,
                letter-spacing 0.2s ease;
        }


        /* =====================================
           HOVER
        ===================================== */

        .menu a:hover {

            color: #e60000;

            transform:
                translateY(-4px)
                skewX(-5deg);

            letter-spacing: 2px;
        }


        /* =====================================
           LÍNEA ROJA
        ===================================== */

        .menu a::after {

            content: "";

            position: absolute;

            left: 12px;
            right: 12px;

            bottom: 0;

            height: 3px;

            background: #e60000;

            transform: scaleX(0);

            transform-origin: center;

            transition:
                transform 0.2s ease;
        }


        .menu a:hover::after,
        .menu a.active::after {

            transform: scaleX(1);
        }


        /* =====================================
           PÁGINA ACTUAL
        ===================================== */

        .menu a.active {

            color: #e60000;

            transform: skewX(-5deg);
        }


        /* =====================================
           SEPARADORES
        ===================================== */

        .separador {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            font-size: 17px;

            font-weight: bold;

            line-height: 1;

            color: #000000;

            margin: 0 1px;

            padding: 0;

            height: auto;

            user-select: none;
        }


        .menu li:hover .separador {

            color: #e60000;

            transform: skewX(-5deg);
        }


        /* =====================================
           BOTÓN MENU
           
           OCULTO EN PC
        ===================================== */

        .menu-toggle {

            display: none;

            border: none;

            background: transparent;

            color: #000000;

            font-family:
                Impact,
                Haettenschweiler,
                "Arial Narrow Bold",
                sans-serif;

            font-size: 23px;

            letter-spacing: 1px;

            cursor: pointer;

            padding: 5px 0;

            position: relative;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }


        .menu-toggle:hover {

            color: #e60000;

            transform: skewX(-5deg);
        }


        /* LÍNEA ROJA DEL BOTÓN */

        .menu-toggle::after {

            content: "";

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;

            height: 3px;

            background: #e60000;

            transform: scaleX(0);

            transition:
                transform 0.2s ease;
        }


        .menu-toggle:hover::after,
        .menu-toggle.open::after {

            transform: scaleX(1);
        }


        /* =====================================
           TABLET + CELULAR
           
           MENÚ A LA IZQUIERDA
        ===================================== */

        @media (max-width: 1024px) {

            /* HEADER */

            .header {

                min-height: 160px;

                padding:
                    25px
                    20px;
            }


            /* TÍTULO */

            .title {

                font-size:
                    clamp(30px, 7vw, 58px);

                letter-spacing: 0;
            }


            /* MENU */

            .menu {

                justify-content: flex-start;

                padding:
                    14px
                    25px;

                min-height: 58px;

                position: relative;
            }


            /* BOTÓN */

            .menu-toggle {

                display: block;

                z-index: 600;
            }


            /* LISTA OCULTA */

            .menu ul {

                position: absolute;

                top: 100%;

                left: 25px;

                width: 280px;

                max-width: calc(100vw - 50px);

                background: #ffffff;

                border-left: 4px solid #e60000;

                padding: 12px 0;

                display: flex;

                flex-direction: column;

                align-items: stretch;

                justify-content: flex-start;

                white-space: normal;

                box-shadow:
                    8px 8px 0 #000000;

                opacity: 0;

                visibility: hidden;

                transform:
                    translateY(-10px);

                pointer-events: none;

                transition:
                    opacity 0.2s ease,
                    transform 0.2s ease,
                    visibility 0.2s ease;
            }


            /* LISTA ABIERTA */

            .menu.open ul {

                opacity: 1;

                visibility: visible;

                transform:
                    translateY(0);

                pointer-events: auto;
            }


            /* ELEMENTOS */

            .menu li {

                width: 100%;

                display: block;
            }


            /* LINKS */

            .menu a {

                width: 100%;

                justify-content: flex-start;

                padding:
                    10px
                    18px;

                font-size: 18px;

                letter-spacing: 1px;
            }


            .menu a:hover {

                transform:
                    translateX(5px)
                    skewX(-5deg);

                letter-spacing: 2px;
            }


            .menu a::after {

                left: 18px;
                right: auto;

                bottom: 4px;

                width: 80px;

                height: 3px;
            }


            /* SEPARADORES */

            .separador {

                display: none;
            }

        }


        /* =====================================
           CELULAR
        ===================================== */

        @media (max-width: 700px) {

            .header {

                min-height: 145px;

                padding:
                    25px
                    15px;
            }


            .title {

                font-size:
                    clamp(27px, 9vw, 46px);
            }


            .divider {

                height: 3px;
            }


            .menu {

                padding:
                    12px
                    18px;

                min-height: 52px;
            }


            .menu-toggle {

                font-size: 20px;
            }


            .menu ul {

                left: 18px;

                width: 245px;

                max-width:
                    calc(100vw - 36px);
            }


            .menu a {

                font-size: 16px;

                padding:
                    10px
                    16px;
            }

        }


        /* =====================================
           CELULARES PEQUEÑOS
        ===================================== */

        @media (max-width: 430px) {

            .header {

                min-height: 135px;
            }


            .title {

                font-size:
                    clamp(24px, 9vw, 40px);
            }


            .menu {

                padding:
                    10px
                    15px;
            }


            .menu-toggle {

                font-size: 18px;
            }


            .menu ul {

                left: 15px;

                width: 225px;

                max-width:
                    calc(100vw - 30px);
            }


            .menu a {

                font-size: 15px;

                padding:
                    9px
                    14px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         ENCABEZADO
    ===================================== -->

    <header class="header">

        <div class="title-container">

            <h1 class="title">
                STREED STUDIO PRINT
            </h1>

        </div>

    </header>


    <!-- =====================================
         LÍNEA DIVISORA
    ===================================== -->

    <div class="divider"></div>


    <!-- =====================================
         MENU STREED
    ===================================== -->

    <nav class="menu" id="menu">

        <!-- BOTÓN SOLO TABLET/CELULAR -->

        <button
            class="menu-toggle"
            id="menuToggle"
            type="button"
            aria-label="Abrir menú"
            aria-expanded="false"
        >
            MENU
        </button>


        <ul id="menuList">

            <li>

                <a
                    href="index.html"
                    class="active"
                >
                    INICIO
                </a>

            </li>


            <li>

                <span class="separador">
                    /
                </span>

                <a href="camisas.html">
                    CAMISAS
                </a>

            </li>


            <li>

                <span class="separador">
                    /
                </span>

                <a href="gorras.html">
                    GORRAS
                </a>

            </li>


            <li>

                <span class="separador">
                    /
                </span>

                <a href="phone-cases.html">
                    PHONE CASES
                </a>

            </li>


            <li>

                <span class="separador">
                    /
                </span>

                <a href="streed-sets.html">
                    STREED SETS
                </a>

            </li>


            <li>

                <span class="separador">
                    /
                </span>

                <a href="streed-club.html">
                    STREED CLUB
                </a>

            </li>

        </ul>

    </nav>


    <!-- =====================================
         JAVASCRIPT DEL MENU
    ===================================== -->

    <script>

        const menu = document.getElementById("menu");

        const menuToggle =
            document.getElementById("menuToggle");

        const menuLinks =
            document.querySelectorAll(".menu a");


        /* =====================================
           ABRIR / CERRAR MENU
        ===================================== */

        menuToggle.addEventListener("click", function () {

            const abierto =
                menu.classList.toggle("open");

            menuToggle.classList.toggle(
                "open",
                abierto
            );

            menuToggle.textContent =
                abierto ? "×" : "MENU";

            menuToggle.setAttribute(
                "aria-expanded",
                abierto
            );

            menuToggle.setAttribute(
                "aria-label",
                abierto
                    ? "Cerrar menú"
                    : "Abrir menú"
            );

        });


        /* =====================================
           CERRAR AL SELECCIONAR UNA PÁGINA
        ===================================== */

        menuLinks.forEach(link => {

            link.addEventListener("click", function () {

                menu.classList.remove("open");

                menuToggle.classList.remove("open");

                menuToggle.textContent = "MENU";

                menuToggle.setAttribute(
                    "aria-expanded",
                    "false"
                );

            });

        });


        /* =====================================
           CERRAR AL HACER CLICK AFUERA
        ===================================== */

        document.addEventListener(
            "click",
            function (event) {

                if (
                    !menu.contains(event.target)
                ) {

                    menu.classList.remove("open");

                    menuToggle.classList.remove("open");

                    menuToggle.textContent = "MENU";

                    menuToggle.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                }

            }
        );


        /* =====================================
           DETECTAR PÁGINA ACTUAL
        ===================================== */

        const paginaActual =
            window.location.pathname
                .split("/")
                .pop() || "index.html";


        menuLinks.forEach(link => {

            const paginaLink =
                link.getAttribute("href");


            if (
                paginaLink === paginaActual
            ) {

                link.classList.add("active");

            } else {

                link.classList.remove("active");

            }

        });

    </script>


</body>
</html>
