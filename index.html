<div class="streed-header">
  <h1 id="streed-title">STREED PRINT STUDIO</h1>

  <div class="light-sweep"></div>
  <div class="flash"></div>

  <div class="divider"></div>
</div>

<style>
  .streed-header {
    position: relative;
    width: 100%;
    height: 125px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: transparent;
  }

  #streed-title {
    position: relative;
    margin: 0;
    padding: 0;
    font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    font-size: 45px;
    font-weight: normal;
    letter-spacing: 3px;
    color: #111111;
    text-align: center;
    z-index: 2;
  }

  /* Rayo */
  .light-sweep {
    position: absolute;
    top: 50%;
    left: -30%;
    width: 22%;
    height: 3px;
    transform: translateY(-50%) rotate(-8deg);

    background: linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,0.4),
      #ffffff,
      rgba(255,255,255,0.9),
      transparent
    );

    box-shadow:
      0 0 5px #ffffff,
      0 0 12px #ffffff,
      0 0 25px rgba(255,255,255,0.9);

    z-index: 3;

    animation: sweep 3.5s ease-in-out infinite;
  }

  /* Destello */
  .flash {
    position: absolute;
    right: 5%;
    top: 50%;

    width: 6px;
    height: 6px;

    border-radius: 50%;
    background: white;

    opacity: 0;
    z-index: 4;

    box-shadow:
      0 0 5px white,
      0 0 15px white,
      0 0 30px white,
      0 0 50px white;

    animation: flash 3.5s ease-in-out infinite;
  }

  /* Línea divisoria */
  .divider {
    position: absolute;
    bottom: 0;
    left: 0;

    width: 100%;
    height: 1px;

    background: #111111;
  }

  @keyframes sweep {

    0% {
      left: -30%;
      opacity: 0;
    }

    8% {
      opacity: 1;
    }

    65% {
      opacity: 1;
    }

    78% {
      left: 105%;
      opacity: 1;
    }

    82% {
      left: 110%;
      opacity: 0;
    }

    100% {
      left: 110%;
      opacity: 0;
    }
  }

  @keyframes flash {

    0%,
    75% {
      opacity: 0;
      transform: translateY(-50%) scale(0.5);
    }

    79% {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }

    83% {
      opacity: 0;
      transform: translateY(-50%) scale(4);
    }

    100% {
      opacity: 0;
    }
  }

  /* Celular */
  @media (max-width: 600px) {

    .streed-header {
      height: 105px;
    }

    #streed-title {
      font-size: 45px;
      letter-spacing: 1px;
      transform: scale(0.75);
    }

  }
</style>

<style>
@import url('https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap');

.streed-box {
  width:100%;
  min-height:120px;
  box-sizing:border-box;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px 10px;
  overflow:visible;

  background:#000;
}

.streed-title {
  margin:0;
  padding:0;

  width:100%;

  text-align:center;

  font-family:'Abril Fatface', Georgia, serif;
  font-size:58px;
  line-height:1.05;

  letter-spacing:-1px;

  color:#fff;

  white-space:normal;

  animation:appear 1s ease both;
}

.white,
.red {
  display:inline-block;
}

.white {
  color:#fff;
  animation:floatWhite 4s ease-in-out 1s infinite;
}

.red {
  color:#D90429;
  animation:floatRed 3s ease-in-out 1s infinite;
}


/* ENTRADA */

@keyframes appear {

  from {
    opacity:0;
    transform:translateY(25px) scale(.95);
    filter:blur(8px);
  }

  to {
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
  }

}


/* SUBLIMA */

@keyframes floatWhite {

  0%,100% {
    transform:translateY(0);
  }

  50% {
    transform:translateY(-5px);
  }

}


/* TU ESTILO */

@keyframes floatRed {

  0%,100% {
    transform:translateY(0) rotate(-2deg);
  }

  50% {
    transform:translateY(-7px) rotate(1deg);
  }

}


/* 📱 TELÉFONO */

@media screen and (max-width:600px) {

  .streed-box {
    min-height:125px;
    padding:15px 5px;
  }

  .streed-title {
    font-size:36px;
    line-height:1.05;
  }

}


/* 📱 TELÉFONOS MUY PEQUEÑOS */

@media screen and (max-width:380px) {

  .streed-box {
    min-height:115px;
  }

  .streed-title {
    font-size:30px;
  }

}
</style>


<div class="streed-box">

  <h1 class="streed-title">
    <span class="white">SUBLIMA</span>
    <span class="red">TU ESTILO.</span>
  </h1>

</div>
