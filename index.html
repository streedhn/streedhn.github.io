    <style>

        /* =====================================
           CONFIGURACIÓN GENERAL
        ===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #ffffff;
            color: #000000;
            overflow-x: hidden;

            animation: entrada 0.7s ease-out;
        }


        /* =====================================
           ANIMACIÓN DE ENTRADA
        ===================================== */

        @keyframes entrada {

            0% {
                opacity: 0;
                transform: translateY(-18px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =====================================
           HEADER
        ===================================== */

        .header {

            width: 100%;
            min-height: 190px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            padding: 30px 100px;

            background: #ffffff;

            z-index: 100;
        }


        /* =====================================
           CONTENEDOR DEL TÍTULO
        ===================================== */

        .title-container {

            display: inline-block;

            position: relative;
        }


        /* =====================================
           TÍTULO
        ===================================== */

        .title {

            font-family:
                Impact,
                Haettenschweiler,
                "Arial Narrow Bold",
                sans-serif;

            font-size: clamp(42px, 6vw, 82px);

            font-weight: normal;

            font-style: italic;

            letter-spacing: 1px;

            text-align: center;

            white-space: nowrap;

            color: #000000;

            animation: flashTexto 1.8s infinite;

            text-shadow:
                0 0 0 transparent;
        }


        /* =====================================
           FLASH DE LAS LETRAS
        ===================================== */

        @keyframes flashTexto {

            0% {

                color: #000000;

                text-shadow:
                    0 0 0 transparent;
            }

            4% {

                color: #ff0000;

                text-shadow:
                    0 0 8px rgba(255, 0, 0, 0.8),
                    0 0 18px rgba(255, 0, 0, 0.5);
            }

            7% {

                color: #ff0000;

                text-shadow:
                    0 0 12px rgba(255, 0, 0, 0.9),
                    0 0 25px rgba(255, 0, 0, 0.6);
            }

            10% {

                color: #000000;

                text-shadow:
                    0 0 0 transparent;
            }

            100% {

                color: #000000;

                text-shadow:
                    0 0 0 transparent;
            }

        }


        /* =====================================
           SEGUNDO FLASH
        ===================================== */

        .title::after {

            content: "STREED STUDIO PRINT";

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;

            color: #ff0000;

            opacity: 0;

            pointer-events: none;

            animation: segundoFlash 1.8s infinite;
        }


        @keyframes segundoFlash {

            0% {
                opacity: 0;
            }

            4% {
                opacity: 0.8;
            }

            6% {
                opacity: 0;
            }

            100% {
                opacity: 0;
            }

        }


        /* =====================================
           LÍNEA DIVISORA
        ===================================== */

        .divider {

            width: 0%;

            height: 4px;

            margin: 0 auto;

            background:
                linear-gradient(
                    90deg,
                    #000000 0%,
                    #000000 75%,
                    #e00000 75%,
                    #e00000 100%
                );

            animation:
                lineaEntrada 0.9s ease-out 0.5s forwards;

            position: relative;

            z-index: 20;
        }


        @keyframes lineaEntrada {

            from {
                width: 0%;
            }

            to {
                width: 92%;
            }

        }


        /* =====================================
           FLASH DE ENTRADA DEL HEADER
        ===================================== */

        .header::after {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background:
                rgba(255, 0, 0, 0.06);

            pointer-events: none;

            animation: entradaFlash 0.9s ease-out;
        }


        @keyframes entradaFlash {

            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }

        }


        /* =====================================
           RESPONSIVE
        ===================================== */

        @media (max-width: 1024px) {

            .header {

                min-height: 160px;

                padding:
                    25px
                    20px;
            }

            .title {

                font-size:
                    clamp(30px, 7vw, 58px);

                letter-spacing: 0;
            }

        }


        @media (max-width: 700px) {

            .header {

                min-height: 145px;

                padding:
                    25px
                    15px;
            }

            .title {

                font-size:
                    clamp(27px, 9vw, 46px);
            }

            .divider {

                height: 3px;
            }

        }


        @media (max-width: 430px) {

            .header {

                min-height: 135px;
            }

            .title {

                font-size:
                    clamp(24px, 9vw, 40px);
            }

        }

    </style>

</head>

<style>
/* BOTÓN HAMBURGUESA */
.menu-toggle {
  position: fixed;
  top: 20px;
  left: 20px;
  width: 42px;
  height: 42px;
  background: white;
  border: none;
  padding: 8px;
  cursor: pointer;
  z-index: 1001;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
}

.menu-toggle span {
  display: block;
  width: 100%;
  height: 3px;
  background: #000;
  transition: 0.3s ease;
}

/* CONVERTIR LAS 3 LÍNEAS EN X */
.menu-toggle.active span:nth-child(1) {
  transform: translateY(9px) rotate(45deg);
}

.menu-toggle.active span:nth-child(2) {
  opacity: 0;
}

.menu-toggle.active span:nth-child(3) {
  transform: translateY(-9px) rotate(-45deg);
}

/* MENÚ LATERAL */
.menu-panel {
  position: fixed;
  top: 0;
  left: 0;
  width: 320px;
  height: 100vh;
  background: #fff;
  border-right: 2px solid #000;
  z-index: 1000;
  padding: 100px 35px 40px;
  box-sizing: border-box;

  transform: translateX(-100%);
  transition: transform 0.35s ease;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

.menu-panel.active {
  transform: translateX(0);
}

.menu-panel a {
  font-family: Impact, sans-serif;
  font-size: 25px;
  color: #000;
  text-decoration: none;
  letter-spacing: 1px;
  margin: 12px 0;
  transition: 0.2s ease;
}

.menu-panel a:hover,
.menu-panel a.active {
  color: #e00000;
}

.menu-line {
  font-family: Impact, sans-serif;
  font-size: 20px;
  color: #000;
  margin: 2px 0;
}

/* FONDO OSCURO */
.menu-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 999;

  opacity: 0;
  visibility: hidden;
  transition: 0.3s ease;
}

.menu-overlay.active {
  opacity: 1;
  visibility: visible;
}

/* MÓVIL */
@media (max-width: 600px) {
  .menu-toggle {
    top: 15px;
    left: 15px;
    width: 38px;
    height: 38px;
  }

  .menu-panel {
    width: 280px;
    padding-top: 85px;
  }

  .menu-panel a {
    font-size: 22px;
  }
</style>

<script>
const menuToggle = document.getElementById("menuToggle");
const menuPanel = document.getElementById("menuPanel");
const menuOverlay = document.getElementById("menuOverlay");

menuToggle.addEventListener("click", () => {
  menuToggle.classList.toggle("active");
  menuPanel.classList.toggle("active");
  menuOverlay.classList.toggle("active");
});

menuOverlay.addEventListener("click", closeMenu);

document.querySelectorAll(".menu-panel a").forEach(link => {
  link.addEventListener("click", closeMenu);
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    closeMenu();
  }
});

function closeMenu() {
  menuToggle.classList.remove("active");
  menuPanel.classList.remove("active");
  menuOverlay.classList.remove("active");
}
</script>
